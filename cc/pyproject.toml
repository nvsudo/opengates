[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opengates-cc"
version = "0.1.0"
description = "Commercial surface for OpenGates."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "jinja2>=3.1.4",
  "opengates-oss>=0.1.0",
  "pyyaml>=6.0.2",
  "python-multipart>=0.0.12",
  "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
]

[project.scripts]
opengates-cc = "opengates_cc.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
opengates-oss = { path = "../oss" }
