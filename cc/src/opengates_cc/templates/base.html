<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}OpenGates CC{% endblock %}</title>
    <style>
      :root {
        --bg-0: #020816;
        --bg-1: #041a39;
        --bg-2: #0b315d;
        --surface: rgba(10, 19, 36, 0.94);
        --surface-soft: rgba(20, 34, 59, 0.86);
        --card: #f4f6f2;
        --card-2: #eff5eb;
        --line: rgba(163, 182, 207, 0.2);
        --text: #eef5ff;
        --muted: #8fa7c2;
        --ink: #09111e;
        --accent: #33c978;
        --accent-strong: #1aa75e;
        --accent-soft: rgba(51, 201, 120, 0.16);
        --bubble-user: linear-gradient(180deg, #dff7d6 0%, #c9efbf 100%);
        --shadow-lg: 0 30px 120px rgba(0, 0, 0, 0.5);
        --shadow-md: 0 20px 60px rgba(0, 0, 0, 0.22);
        --radius-xl: 34px;
        --radius-lg: 22px;
        --radius-md: 16px;
        --font-display: "Avenir Next", "Helvetica Neue", "Segoe UI", sans-serif;
        --font-body: "Avenir Next", "Helvetica Neue", "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top, rgba(37, 161, 255, 0.18), transparent 24%),
          radial-gradient(circle at bottom left, rgba(27, 255, 176, 0.12), transparent 30%),
          linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 52%, #011128 100%);
        color: var(--text);
        font-family: var(--font-body);
      }

      body {
        min-height: 100svh;
      }

      a {
        color: #9ee4ff;
        text-decoration: none;
      }

      .stage {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px 14px;
      }

      .device-shell {
        width: min(430px, 100%);
        border-radius: 44px;
        padding: 14px;
        background: linear-gradient(180deg, rgba(59, 72, 88, 0.95), rgba(11, 15, 22, 0.98));
        box-shadow: var(--shadow-lg);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .screen {
        height: min(860px, calc(100svh - 56px));
        min-height: 720px;
        border-radius: 32px;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        background:
          radial-gradient(circle at top, rgba(6, 39, 84, 0.55), transparent 28%),
          linear-gradient(180deg, #021130 0%, #010d24 100%);
      }

      .screen::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 0%, rgba(51, 201, 120, 0.08), transparent 30%),
          radial-gradient(circle at 20% 95%, rgba(51, 201, 120, 0.05), transparent 22%);
        pointer-events: none;
      }

      .statusbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 24px 8px;
        color: rgba(255, 255, 255, 0.98);
        font-weight: 700;
        position: relative;
        z-index: 1;
      }

      .status-icons {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .pill-battery {
        width: 26px;
        height: 13px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.75);
        position: relative;
      }

      .pill-battery::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        right: 5px;
        bottom: 2px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.9);
      }

      .topbar {
        margin: 0 auto 14px;
        padding: 0 18px;
        width: calc(100% - 28px);
        z-index: 1;
      }

      .nav-pill {
        height: 64px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px 10px 16px;
        background: linear-gradient(180deg, rgba(53, 68, 97, 0.92), rgba(35, 44, 64, 0.94));
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
      }

      .nav-main {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(190, 232, 214, 0.85));
        color: #082039;
        display: grid;
        place-items: center;
        font-weight: 800;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.22);
      }

      .nav-title {
        font-size: 1.5rem;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .nav-status {
        font-size: 0.78rem;
        color: var(--muted);
        margin-top: 2px;
      }

      .nav-action {
        min-width: 44px;
        height: 44px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        color: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(14, 18, 29, 0.42);
        font-size: 1.25rem;
      }

      .scroll {
        flex: 1;
        overflow: auto;
        padding: 8px 16px 18px;
        position: relative;
        z-index: 1;
      }

      .scroll::-webkit-scrollbar {
        width: 0;
        height: 0;
      }

      .chat {
        display: grid;
        gap: 12px;
        align-content: start;
      }

      .bubble {
        max-width: 84%;
        border-radius: 24px;
        padding: 16px 18px;
        box-shadow: var(--shadow-md);
      }

      .bubble.assistant {
        background: var(--card);
        color: var(--ink);
        border-top-left-radius: 8px;
      }

      .bubble.user {
        margin-left: auto;
        background: var(--bubble-user);
        color: #0e1a11;
        border-top-right-radius: 8px;
      }

      .bubble.system {
        max-width: 100%;
        background: rgba(255,255,255,0.08);
        color: var(--text);
        border: 1px solid rgba(255,255,255,0.08);
      }

      .eyebrow {
        font-size: 0.74rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.45);
        margin-bottom: 7px;
        font-weight: 700;
      }

      .assistant .eyebrow {
        color: #6f798b;
      }

      .headline {
        font-size: 1.1rem;
        line-height: 1.2;
        font-weight: 750;
        margin: 0 0 8px;
      }

      .body-copy,
      .message-copy {
        line-height: 1.45;
        font-size: 1rem;
      }

      .topic-list {
        display: grid;
        gap: 10px;
        margin-top: 14px;
      }

      .topic-button {
        width: 100%;
        border: 0;
        cursor: pointer;
        text-align: left;
        padding: 14px 16px;
        border-radius: 14px;
        background: linear-gradient(180deg, var(--accent) 0%, var(--accent-strong) 100%);
        color: white;
        font: inherit;
        font-weight: 700;
        transition: transform 140ms ease, box-shadow 140ms ease;
        box-shadow: 0 12px 28px rgba(26, 167, 94, 0.22);
      }

      .topic-button:hover,
      .topic-button.is-active {
        transform: translateY(-1px);
        box-shadow: 0 14px 34px rgba(26, 167, 94, 0.3);
      }

      .topic-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 11px 14px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.09);
        color: var(--text);
        font-weight: 650;
      }

      .topic-chip button,
      .topic-inline {
        border: 0;
        background: rgba(11, 16, 27, 0.1);
        border-radius: 12px;
        padding: 8px 10px;
        font: inherit;
        cursor: pointer;
        color: inherit;
      }

      .form-card {
        display: grid;
        gap: 12px;
      }

      .field-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field label {
        font-size: 0.88rem;
        font-weight: 700;
        color: #213246;
      }

      .field input,
      .field textarea {
        width: 100%;
        border: 1px solid rgba(34, 50, 72, 0.14);
        background: #ffffff;
        color: #09111e;
        border-radius: 14px;
        padding: 13px 14px;
        font: inherit;
        resize: vertical;
      }

      .field textarea {
        min-height: 132px;
      }

      .subnote {
        color: #65748a;
        font-size: 0.88rem;
        line-height: 1.4;
      }

      .submit-row {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
      }

      .primary-button {
        border: 0;
        border-radius: 16px;
        padding: 13px 16px;
        background: linear-gradient(180deg, var(--accent) 0%, var(--accent-strong) 100%);
        color: white;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 14px 32px rgba(26, 167, 94, 0.26);
      }

      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.92rem;
        color: #243346;
      }

      .composer-wrap {
        padding: 14px 14px 18px;
        position: sticky;
        bottom: 0;
        z-index: 2;
        background: linear-gradient(180deg, rgba(1, 13, 36, 0.06), rgba(1, 13, 36, 0.96) 36%);
      }

      .composer {
        display: flex;
        gap: 10px;
        align-items: flex-end;
        padding: 10px;
        border-radius: 24px;
        background: rgba(244, 246, 242, 0.95);
        box-shadow: var(--shadow-md);
      }

      .composer textarea {
        border: 0;
        background: transparent;
        color: #08111b;
        font: inherit;
        resize: none;
        width: 100%;
        min-height: 50px;
        max-height: 140px;
        padding: 8px 10px;
      }

      .composer button {
        width: 50px;
        height: 50px;
        border-radius: 18px;
        border: 0;
        background: linear-gradient(180deg, var(--accent) 0%, var(--accent-strong) 100%);
        color: white;
        font-weight: 800;
        font-size: 1rem;
        cursor: pointer;
        flex: 0 0 auto;
      }

      .thread-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 4px 0 10px;
      }

      .meta-chip {
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 0.82rem;
        font-weight: 700;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.08);
        color: rgba(255,255,255,0.86);
      }

      .meta-chip.good {
        background: rgba(51, 201, 120, 0.14);
        border-color: rgba(51, 201, 120, 0.32);
        color: #b6f0ca;
      }

      .nav-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: rgba(255, 255, 255, 0.72);
        font-size: 0.92rem;
        margin-bottom: 10px;
      }

      .center-copy {
        text-align: center;
        padding: 18px 12px 12px;
      }

      .desk-list {
        display: grid;
        gap: 12px;
        margin-top: 16px;
      }

      .desk-link {
        display: block;
        padding: 16px 18px;
        border-radius: 20px;
        background: rgba(244, 246, 242, 0.96);
        color: #08111b;
        box-shadow: var(--shadow-md);
      }

      .desk-name {
        font-size: 1rem;
        font-weight: 800;
      }

      .desk-preview {
        font-size: 0.92rem;
        line-height: 1.45;
        color: #546070;
        margin-top: 6px;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 520px) {
        .stage {
          padding: 0;
        }

        .device-shell {
          width: 100%;
          padding: 0;
          border-radius: 0;
          border: 0;
        }

        .screen {
          height: 100svh;
          min-height: 100svh;
          border-radius: 0;
        }

        .field-grid {
          grid-template-columns: 1fr;
        }

        .bubble {
          max-width: 88%;
        }
      }
    </style>
    {% block head %}{% endblock %}
  </head>
  <body>
    <div class="stage">
      <div class="device-shell">
        <div class="screen">
          <div class="statusbar">
            <div>9:41</div>
            <div class="status-icons">
              <div>●●●</div>
              <div class="pill-battery"></div>
            </div>
          </div>
          {% block screen %}{% endblock %}
        </div>
      </div>
    </div>
    {% block scripts %}{% endblock %}
  </body>
</html>
